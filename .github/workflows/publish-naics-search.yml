name: Publish naics-search to npm

on:
  push:
    tags:
      - "naics-search-v*"

permissions:
  contents: write # V63: needed to create the GitHub Release + upload data assets
  id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >=11.5.1
      - run: pnpm install --frozen-lockfile
      # V66: app's typecheck (pnpm run check) resolves BOTH pkgs' dist/ — build
      # naics-search first (naics-search-react depends on it), in dependency order.
      - run: pnpm --filter @cajuncodemonkey/naics-search run build
      - run: pnpm --filter @cajuncodemonkey/naics-search-react run build
      - run: pnpm run check
      - name: Publish naics-search
        run: npm publish --access public --provenance
        working-directory: packages/naics-search
      - name: Build naics-search-data (mirrors naics-search's src/data into itself)
        run: pnpm run build
        working-directory: packages/naics-search-data
      - name: Publish naics-search-data (V64 — version kept lockstep, same tag)
        run: npm publish --access public --provenance
        working-directory: packages/naics-search-data
      - name: Create GitHub Release + attach data assets (V54/V63 fallback provider source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes \
            packages/naics-search/src/data/naics-model.json \
            packages/naics-search/src/data/naics-hierarchy.json
